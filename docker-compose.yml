services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yamagata-oni-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - mysql
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=yamagata_oni
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: yamagata-oni-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: yamagata_oni
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  node:
    image: node:20-alpine
    container_name: yamagata-oni-node
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  mysql_data:
